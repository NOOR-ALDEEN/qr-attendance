<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الحضور الذكي</title>
<meta name="description" content="تسجيل حضور الطلبة بالـ QR — © 2026 Dr. Noor Aldeen">
<meta name="theme-color" content="#312E81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الحضور">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F1F5F9; --card:#fff; --border:#E2E8F0; --text:#0F172A; --muted:#64748B;
  --indigo:#4338CA; --indigo-d:#3730A3; --navy:#1E1B4B; --cyan:#0891B2;
  --green:#059669; --green-bg:#ECFDF5; --amber:#B45309; --amber-bg:#FFFBEB; --red:#B91C1C; --red-bg:#FEF2F2;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic","Noto Naskh Arabic","SF Arabic","Geeza Pro",system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit}
header.top{position:sticky;top:0;z-index:20;color:#fff;padding:calc(10px + var(--safe-t)) 16px 12px;
  background:linear-gradient(90deg,#4338CA,#0891B2);box-shadow:0 2px 12px rgba(15,23,42,.18)}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{margin:0;font-size:18px;font-weight:800}
header.top .sub{font-size:12px;opacity:.9;margin-top:2px}
header.top .clock{font-size:20px;font-weight:800;color:#CFFAFE;direction:rtl;white-space:nowrap}
main{padding:14px 12px calc(84px + var(--safe-b));max-width:860px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;background:var(--navy);
  padding:6px 6px calc(6px + var(--safe-b));box-shadow:0 -2px 12px rgba(15,23,42,.25)}
nav.tabs button{flex:1;border:0;background:transparent;color:#C7D2FE;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:700}
nav.tabs button .i{display:block;font-size:20px;line-height:1.3}
nav.tabs button.on{background:#fff;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--navy)}
.muted{color:var(--muted);font-size:12.5px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}
input.in,select.in{width:100%;padding:11px 12px;border:1px solid #CBD5E1;border-radius:12px;background:#F8FAFC;color:var(--text)}
input.in:focus,select.in:focus{outline:2px solid #6366F1;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;color:#fff;background:var(--indigo)}
.btn:active{transform:scale(.98)}
.btn.green{background:var(--green)} .btn.red{background:#DC2626}
.btn.ghost{background:#EEF2FF;color:var(--indigo-d)} .btn.rghost{background:var(--red-bg);color:var(--red)}
.btn.block{display:block;width:100%;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 auto}
.banner{background:var(--green-bg);color:#065F46;border:1px solid #A7F3D0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13.5px;margin-bottom:10px}
.cam{position:relative;background:#0F172A;border-radius:16px;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#94A3B8;text-align:center}
.cam video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;transform:translateZ(0)}
#camMsg{position:relative;z-index:2;padding:10px}
.cam video.mirror{transform:translateZ(0) scaleX(-1)}
.cam .frame{position:absolute;z-index:1;width:62%;aspect-ratio:1;left:19%;top:50%;transform:translateY(-50%);pointer-events:none}
.cam .frame i{position:absolute;width:22%;height:22%;border:4px solid #fff;border-radius:6px}
.cam .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.cam .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.cam .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.cam .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.cam .tools{position:absolute;z-index:3;bottom:10px;left:10px;display:flex;gap:8px}
.cam .tools button{border:0;border-radius:50%;width:42px;height:42px;background:rgba(15,23,42,.65);color:#fff;font-size:18px}
.cam.flash-ok{box-shadow:inset 0 0 0 6px #10B981}.cam.flash-bad{box-shadow:inset 0 0 0 6px #EF4444}
.result{border:2px solid #CBD5E1;background:#F8FAFC;border-radius:16px;padding:12px;text-align:center;margin:12px 0}
.result .ic{font-size:34px;font-weight:900;line-height:1.1}
.result .nm{font-size:21px;font-weight:900;margin-top:2px;word-break:break-word}
.result .ms{font-size:13.5px;margin-top:4px;white-space:pre-line}
.result.ok{background:var(--green-bg);border-color:#10B981;color:#047857}
.result.dup{background:var(--amber-bg);border-color:#F59E0B;color:var(--amber)}
.result.bad{background:var(--red-bg);border-color:#EF4444;color:var(--red)}
.result .nm{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;text-align:center;padding:8px 4px}
.stat b{display:block;font-size:24px}
.stat span{font-size:11.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #EEF2F7}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:800;word-break:break-word}
.item .s{font-size:12px;color:var(--muted)}
.item .x{border:0;background:var(--red-bg);color:var(--red);border-radius:10px;width:34px;height:34px;font-weight:900}
.item.tap{cursor:pointer}.item.tap:active{background:#F8FAFC}
.pill{display:inline-block;background:#EEF2FF;color:var(--indigo-d);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.row{display:flex;gap:8px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
#backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:none}
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:50;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding:16px 16px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease;max-width:860px;margin:0 auto}
#sheet.open{transform:none}
#sheet .grab{width:44px;height:5px;background:#CBD5E1;border-radius:9px;margin:-6px auto 12px}
#sheet h3{margin:0 0 10px;color:var(--navy)}
#sheet .sheetx{position:absolute;top:10px;left:12px;border:0;background:#F1F5F9;color:#475569;width:36px;height:36px;border-radius:50%;font-size:16px;font-weight:900}
#sheet h3{padding-left:44px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));z-index:60;background:#0F172A;color:#fff;
  padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;display:none;text-align:center}
#toast.bad{background:#B91C1C}
.cardimg{width:100%;max-width:340px;display:block;margin:0 auto 10px;border-radius:14px;box-shadow:0 4px 18px rgba(15,23,42,.15)}
.about{text-align:center}
.logo{width:76px;height:76px;border-radius:50%;margin:4px auto 8px;display:flex;align-items:center;justify-content:center;
  background:#4F46E5;border:4px solid #22D3EE;color:#fff;font-weight:900;font-size:26px}
.copy{background:#EEF2FF;border:1px solid #C7D2FE;border-radius:12px;padding:10px;margin-top:12px;font-size:12.5px;color:#475569}
.copy b{display:block;color:#312E81;font-size:14px;margin-bottom:4px}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div><h1>📋 نظام الحضور الذكي</h1><div class="sub" id="hdate"></div></div>
    <div class="clock" id="hclock"></div>
  </div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-tab="att" class="on"><span class="i">📷</span>الحضور</button>
  <button data-tab="stu"><span class="i">👥</span>الطلاب</button>
  <button data-tab="rec"><span class="i">📊</span>السجلات</button>
  <button data-tab="more"><span class="i">⚙️</span>المزيد</button>
</nav>
<div id="backdrop"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="filepick" class="hide">
<script src="config.js"></script>
<script src="jszip.min.js"></script>
<script src="qr.js"></script>
<script src="core.js"></script>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
